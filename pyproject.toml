[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "control-deck-media-forge"
dynamic = ["version"]
description = "Local-first media generation add-on for ControlDeck"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "pillow>=10.0,<13",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8,<9",
]

[project.scripts]
media-forge = "mediaforge.__main__:main"

[tool.hatch.version]
path = "backend/mediaforge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["backend/mediaforge"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["backend", "."]
testpaths = ["tests"]
