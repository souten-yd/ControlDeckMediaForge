<!doctype html>
<html lang="ja" data-bridge="waiting">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Media Forge</title>
    <!-- MEDIA_FORGE_INLINE_STYLE -->
  </head>
  <body>
    <div id="app" data-mode="simple" data-view="create" aria-busy="true">

      <div id="skeleton" aria-hidden="true">
        <div class="sk sk-title"></div>
        <div class="sk sk-block"></div>
        <div class="sk sk-block"></div>
      </div>

      <header id="shell-header">
        <h1>Media Forge</h1>
        <span class="pill" title="推論はこの端末の中だけで実行されます">ローカルのみ</span>
        <span class="grow"></span>
        <div class="modeswitch" role="group" aria-label="表示モード">
          <button type="button" id="mode-simple" aria-pressed="true">シンプル</button>
          <button type="button" id="mode-advanced" aria-pressed="false">詳細</button>
        </div>
        <button type="button" id="nav-settings" class="icon" aria-label="設定">⚙</button>
      </header>

      <nav id="shell-nav" aria-label="Media Forge">
        <button type="button" id="nav-create" data-view="create" aria-current="page">作る</button>
        <button type="button" id="nav-library" data-view="library">ライブラリ</button>
        <button type="button" id="nav-activity" data-view="activity">状況<span class="badge" id="activity-badge" hidden>0</span></button>
      </nav>

      <main>
        <!-- 作る -->
        <section id="view-create" class="view" data-view="create">
          <form id="create-form" class="panel">
            <label class="field-label" for="create-intent">何を作りますか？</label>
            <textarea id="create-intent" required maxlength="8000" rows="4"
              placeholder="夜の机に置かれた、小さな青いロボット"></textarea>

            <div id="attach-row">
              <label id="attach-image" class="dropzone">
                <span id="attach-label">＋ 画像を追加</span>
                <input id="source-file" type="file" accept="image/png,image/jpeg">
              </label>
              <button type="button" id="attach-clear" hidden>使わない</button>
            </div>

            <div id="edit-block" hidden>
              <p class="section-label">この画像を…</p>
              <div id="edit-actions" role="radiogroup" aria-label="編集方法"></div>
              <p id="guarantee-badge" class="guarantee"></p>

              <label id="mask-input" class="sub-field" hidden>
                変更する場所の画像（白＝変える／黒＝そのまま）
                <input id="mask-file" type="file" accept="image/png,image/jpeg">
                <span class="hint">筆で塗って指定する機能は次の段階で入ります。</span>
              </label>

              <label id="reference-input" class="sub-field" hidden>
                参考にする画像（1〜3枚）
                <input id="reference-files" type="file" accept="image/png,image/jpeg" multiple>
              </label>
            </div>

            <p class="section-label">サイズ</p>
            <div id="size-presets" class="chips" role="radiogroup" aria-label="サイズ"></div>

            <p class="section-label">枚数</p>
            <div id="count-chips" class="chips" role="radiogroup" aria-label="枚数"></div>

            <div data-adv-slot="create"></div>

            <button class="primary" type="submit" id="create-submit">作る</button>
            <p id="create-status" role="status" class="hint"></p>
          </form>

          <div id="stage">
            <div id="stage-progress" hidden>
              <p class="stage-phase" id="progress-phase">準備しています</p>
              <div class="track"><i id="progress-bar"></i></div>
              <p class="hint" id="progress-detail"></p>
              <button type="button" id="progress-cancel">中止</button>
            </div>

            <div id="stage-result" hidden>
              <img id="result-image" alt="生成された画像">
              <div id="candidate-strip" class="strip"></div>
              <div class="actions">
                <button type="button" id="result-edit">これを編集</button>
                <button type="button" id="result-detail">詳細</button>
              </div>
            </div>

            <div id="stage-recent">
              <p class="section-label">最近作ったもの</p>
              <div id="recent-strip" class="strip"></div>
              <p id="recent-empty" class="hint">まだ何もありません。作りたいものを書いて「作る」を押してください。</p>
            </div>
          </div>
        </section>

        <!-- ライブラリ -->
        <section id="view-library" class="view" data-view="library" hidden>
          <div class="view-head">
            <div id="library-kinds" class="chips" role="radiogroup" aria-label="種類"></div>
            <button type="button" data-refresh="library">更新</button>
          </div>
          <div id="library-grid" class="grid"></div>
          <p id="library-empty" class="hint" hidden>まだ素材はありません。</p>
          <button type="button" id="library-more" hidden>もっと見る</button>
        </section>

        <!-- 状況 -->
        <section id="view-activity" class="view" data-view="activity" hidden>
          <div class="view-head">
            <p class="section-label">実行中と履歴</p>
            <div>
              <button type="button" id="open-host-jobs">ControlDeck の Jobs</button>
              <button type="button" data-refresh="activity">更新</button>
            </div>
          </div>
          <div id="activity-list" class="rows"></div>
          <p id="activity-empty" class="hint" hidden>まだ実行した記録はありません。</p>
        </section>

        <!-- 設定 -->
        <section id="view-settings" class="view" data-view="settings" hidden>
          <p class="section-label">この拡張機能について</p>
          <dl class="facts">
            <div><dt>推論</dt><dd>この端末の中だけ（backend で強制。UI から解除できません）</dd></div>
            <div><dt>生成処理</dt><dd>本体とは別のプロセスで動きます</dd></div>
            <div><dt>ControlDeck 連携</dt><dd id="host-state">確認しています…</dd></div>
          </dl>
          <p class="section-label">今できること</p>
          <div id="capability-list" class="rows"></div>
          <div data-adv-slot="settings"></div>
        </section>
      </main>

      <div id="mini-progress" hidden>
        <span id="mini-phase">生成しています</span>
        <span class="track"><i id="mini-bar"></i></span>
        <button type="button" id="mini-cancel" aria-label="中止">✕</button>
      </div>

      <dialog id="detail-dialog">
        <button type="button" id="close-dialog" aria-label="閉じる">×</button>
        <h2 id="detail-title">詳細</h2>
        <div id="detail-body"></div>
      </dialog>
    </div>

    <!-- 詳細モードでのみ DOM へ載せる断片。既定では描画しない。 -->
    <template data-adv-template="create">
      <div class="advanced" id="advanced-create">
        <p class="section-label">詳細設定</p>
        <div class="form-row">
          <label>幅<input id="advanced-width" type="number" step="16" inputmode="numeric"></label>
          <label>高さ<input id="advanced-height" type="number" step="16" inputmode="numeric"></label>
        </div>
        <p id="advanced-size-hint" class="hint"></p>
        <div class="form-row">
          <label>出力形式
            <select id="advanced-format">
              <option value="png">png</option>
              <option value="webp">webp</option>
              <option value="jpeg">jpeg</option>
            </select>
          </label>
          <label>枚数（1〜8）
            <input id="advanced-count" type="number" min="1" max="8" value="1">
          </label>
        </div>
        <div class="form-row">
          <label>モデル方針
            <select id="advanced-policy">
              <option value="auto">auto</option>
              <option value="fast">fast</option>
              <option value="balanced">balanced</option>
              <option value="quality">quality</option>
              <option value="low_vram">low_vram</option>
              <option value="manual">manual</option>
            </select>
          </label>
          <label id="advanced-model-row" hidden>モデル
            <select id="advanced-model"></select>
          </label>
        </div>
        <label class="check"><input id="advanced-semantic" type="checkbox">内容チェック（qa.semantic）</label>
        <p id="advanced-semantic-reason" class="hint"></p>
        <label>作り直しの上限（0〜3）
          <input id="advanced-attempts" type="number" min="0" max="3" value="0">
        </label>
        <p class="hint" id="advanced-constraints"></p>
      </div>
    </template>

    <template data-adv-template="settings">
      <div class="advanced" id="advanced-settings">
        <p class="section-label">モデル</p>
        <div id="advanced-models" class="rows"></div>
        <p class="section-label">連携診断</p>
        <pre id="advanced-host-integration"></pre>
      </div>
    </template>

    <!-- MEDIA_FORGE_INLINE_SCRIPT -->
  </body>
</html>
